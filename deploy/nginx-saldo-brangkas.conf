# Server block KHUSUS Saldo Brangkas.
# Terpisah dari juwita.biz.id / Juwita One. Jangan ubah blok tersebut.
server {
    listen 80;
    listen [::]:80;
    server_name 103.127.96.23;

    root /var/www/saldo-brangkas;
    index index.html;

    access_log /var/log/nginx/saldo-brangkas.access.log;
    error_log  /var/log/nginx/saldo-brangkas.error.log;

    # Backend API (Python) -> localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
