# Server block HTTPS Saldo Brangkas (saldo.brangkas.biz.id).
# Terpisah dari juwita.biz.id / jadwal-sholat / blok IP 103.127.96.23. Jangan ubah blok tersebut.
# Catatan: baris ssl_certificate ditambahkan otomatis oleh certbot (deploy/setup-https.sh).
server {
    listen 80;
    listen [::]:80;
    server_name saldo.brangkas.biz.id;

    root /var/www/saldo-brangkas;
    index index.html;

    access_log /var/log/nginx/brangkas-https.access.log;
    error_log  /var/log/nginx/brangkas-https.error.log;

    # Backend API (Python) -> localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Halaman utama & login tanpa cache agar update selalu terlihat
    location = / {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /login.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
