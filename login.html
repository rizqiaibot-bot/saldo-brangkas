<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SALDO BRANGKAS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root{
      --dark:#070b17;
      --dark2:#101827;
      --blue:#2563eb;
      --muted:#64748b;
      --text:#0f172a;
      --shadow:0 20px 45px rgba(0,0,0,.35);
      --radius:18px;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--dark),var(--dark2));
      padding:20px;
    }
    .login-card{
      background:#fff;width:100%;max-width:400px;border-radius:var(--radius);
      box-shadow:var(--shadow);padding:34px 30px;
    }
    .brand{text-align:center;margin-bottom:24px;}
    .brand-icon{
      width:64px;height:64px;margin:0 auto 14px;border-radius:18px;
      background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:30px;
      box-shadow:0 10px 22px rgba(37,99,235,.35);
    }
    .brand h1{font-size:22px;font-weight:800;letter-spacing:1.5px;color:var(--text);}
    .brand p{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600;}
    label{display:block;font-weight:700;font-size:13px;margin:0 0 7px;color:#334155;}
    .input-icon{position:relative;margin-bottom:15px;}
    .input-icon i{
      position:absolute;left:14px;top:50%;transform:translateY(-50%);
      color:#94a3b8;font-size:15px;pointer-events:none;
    }
    .input-icon input{
      width:100%;border:1px solid #cfd8e3;border-radius:10px;padding:13px 13px 13px 40px;
      font-size:14px;outline:none;height:46px;transition:.2s;background:#fff;
    }
    .input-icon input:focus{border-color:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.14);}
    .btn-login{
      width:100%;border:none;border-radius:10px;padding:13px 16px;height:46px;
      background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;
      font-size:14px;font-weight:800;cursor:pointer;transition:.18s ease;margin-top:6px;
    }
    .btn-login:hover{transform:translateY(-1px);filter:brightness(.98);}
    .btn-login:disabled{opacity:.65;cursor:not-allowed;transform:none;filter:none;}
    .login-error{
      display:none;margin-bottom:14px;background:#fff1f2;border:1px solid #fecdd3;
      color:#e11d48;padding:10px 13px;border-radius:10px;font-size:13px;font-weight:600;
    }
    .login-note{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);font-weight:600;}
    .login-note i{color:var(--blue);margin-right:5px;}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-vault"></i></div>
      <h1>SALDO BRANGKAS</h1>
      <p>Masuk untuk mengelola saldo brangkas</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <label for="username">Username</label>
      <div class="input-icon">
        <i class="fa-regular fa-user"></i>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" required autofocus>
      </div>

      <label for="password">Password</label>
      <div class="input-icon">
        <i class="fa-solid fa-lock"></i>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
      </div>

      <div class="login-error" id="loginError"></div>

      <button type="submit" class="btn-login" id="btnLogin">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk
      </button>
    </form>

    <div class="login-note">
      <i class="fa-solid fa-shield-halved"></i> Akses dilindungi — data tersimpan aman di database VPS.
    </div>
  </div>

  <script>
    // API backend VPS (sama seperti di index.html)
    async function api(path, options){
      const opts = Object.assign({ headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' }, options || {});
      if (opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
      const res = await fetch('/api' + path, opts);
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
      return data;
    }

    // Kalau sesi masih aktif, langsung masuk ke aplikasi.
    async function checkSession(){
      try {
        const s = await api('/session');
        if (s && s.authenticated) {
          window.location.replace('/');
        }
      } catch (e) {
        // Backend belum siap — biarkan form login tetap dipakai.
      }
    }

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btnLogin');
    const errBox = document.getElementById('loginError');

    function showError(msg){
      errBox.textContent = msg;
      errBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Isi username dan password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memeriksa...';
      errBox.style.display = 'none';

      try {
        await api('/login', { method:'POST', body:{ username, password } });
        window.location.replace('/');
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk';
      }
    });

    checkSession();
  </script>
</body>
</html>
